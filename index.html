<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 50px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #FFD700; /* زرد طلایی */
            text-shadow: 0 0 10px #FFD700;
            font-size: 3em;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            display: inline-block;
            transition: 0.3s;
        }
        .container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #FFD700;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        .tech-box {
            margin-top: 20px;
            color: #FFD700;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>خوش اومدی به دنیای مانی!</h1>
        <p>اینجا قلبِ تپنده‌ی پروژه‌های منه:</p>
        <div class="tech-box">
            [ Arduino Robotics | 3D Design | Coding ]
        </div>
        <p>در حال ساخت آینده... 🤖</p>
    </div>

</body>
</html>
